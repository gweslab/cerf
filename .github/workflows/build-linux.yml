name: build-linux

on:
  workflow_call:
    inputs:
      host-branch:
        type: string
        required: true
      runner:
        type: string
        required: true
      container:
        type: string
        required: true
      compiler-env:
        type: string
        required: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container }}
    env:
      HOST_BRANCH: ${{ inputs.host-branch }}
      VCPKG_ROOT: /opt/vcpkg

    steps:
      - name: Install the checkout tools
        run: |
          dnf -y install epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install git python3

      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install the build dependencies
        run: python3 tools/dnf_packages.py

      - name: Fetch core libraries
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init libservicelocator libCerfEngine libCerfCore

      - name: Install vcpkg
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - uses: ./.github/actions/vcpkg-cache
        with:
          stage: restore
          host-branch: ${{ env.HOST_BRANCH }}

      - name: Name the Qt download folder
        id: qt
        run: python3 tools/qt_online_repository.py --cache-outputs "$HOST_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Restore the Qt download
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.qt.outputs.path }}
          key: qt-${{ env.HOST_BRANCH }}-${{ steps.qt.outputs.key }}

      - name: Stamp version.h with CI build info
        id: version
        run: python3 tools/stamp_version.py --run=${{ github.run_number }} --sha=${{ github.sha }} --host-branch=${{ env.HOST_BRANCH }}

      - name: Fetch the CE apps
        uses: actions/download-artifact@v4
        with:
          name: ce-apps
          path: ci/ce_apps

      - uses: ./.github/actions/compiler-cache
        with:
          stage: restore
          host-branch: ${{ env.HOST_BRANCH }}

      - uses: ./.github/actions/rust-library-cache
        with:
          stage: restore
          library: resvg
          host-branch: ${{ env.HOST_BRANCH }}

      - uses: ./.github/actions/rust-library-cache
        with:
          stage: restore
          library: librashader
          host-branch: ${{ env.HOST_BRANCH }}

      - name: Build
        shell: bash
        run: |
          source "${{ inputs.compiler-env }}"
          python3 build.py --config Release --mode production --ce-apps-from=ci/ce_apps

      - uses: ./.github/actions/vcpkg-cache
        with:
          stage: save
          host-branch: ${{ env.HOST_BRANCH }}

      - name: Save the Qt download
        if: ${{ !cancelled() && steps.cache-qt.outputs.cache-hit != 'true' && hashFiles(steps.qt.outputs.stamp) != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.qt.outputs.path }}
          key: qt-${{ env.HOST_BRANCH }}-${{ steps.qt.outputs.key }}

      - uses: ./.github/actions/rust-library-cache
        if: ${{ !cancelled() }}
        with:
          stage: save
          library: resvg
          host-branch: ${{ env.HOST_BRANCH }}

      - uses: ./.github/actions/rust-library-cache
        if: ${{ !cancelled() }}
        with:
          stage: save
          library: librashader
          host-branch: ${{ env.HOST_BRANCH }}

      - uses: ./.github/actions/compiler-cache
        if: ${{ !cancelled() }}
        with:
          stage: save
          host-branch: ${{ env.HOST_BRANCH }}

      - name: List the third-party sources
        run: python3 tools/third_party_sources.py list "$HOST_BRANCH" "${{ steps.version.outputs.out }}"

      - name: List the files of the build
        run: python3 tools/release_file_list.py "${{ steps.version.outputs.out }}"

      - name: Pack the build
        id: pack
        run: |
          name="${{ steps.version.outputs.artifact }}"
          python3 tools/pack_release.py "ci/dist/$name.zip" "${{ steps.version.outputs.out }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "zip=ci/dist/$name.zip" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.zip }}
