name: build-macos

on:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest
    env:
      HOST_BRANCH: macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch core libraries
        run: git submodule update --init libservicelocator libCerfEngine libCerfCore

      - name: Install the build dependencies
        run: python3 tools/homebrew_packages.py

      - name: Stamp version.h with CI build info
        id: version
        run: python3 tools/stamp_version.py --run=${{ github.run_number }} --sha=${{ github.sha }} --host-branch=${{ env.HOST_BRANCH }}

      - name: Fetch the Linux build
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-linux-amd64 }}
          path: ci/linux

      - name: Unpack the CE apps of the Linux build
        run: unzip -q "ci/linux/${{ steps.version.outputs.artifact-linux-amd64 }}.zip" "ce_apps/*" -d ci/linux

      - uses: ./.github/actions/compiler-cache
        with:
          stage: restore
          host-branch: ${{ env.HOST_BRANCH }}

      - uses: ./.github/actions/resvg-cache
        with:
          stage: restore
          host-branch: ${{ env.HOST_BRANCH }}

      - name: Build
        run: python3 build.py --config Release --mode production --ce-apps-from=ci/linux/ce_apps

      - uses: ./.github/actions/resvg-cache
        if: ${{ !cancelled() }}
        with:
          stage: save
          host-branch: ${{ env.HOST_BRANCH }}

      - uses: ./.github/actions/compiler-cache
        if: ${{ !cancelled() }}
        with:
          stage: save
          host-branch: ${{ env.HOST_BRANCH }}

      - name: Pack the build
        id: pack
        run: |
          name="${{ steps.version.outputs.artifact }}"
          python3 tools/pack_release.py "ci/dist/$name.zip" "${{ steps.version.outputs.out }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "zip=ci/dist/$name.zip" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.zip }}
