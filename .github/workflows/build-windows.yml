name: build-windows

on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    env:
      HOST_BRANCH: win32-x86

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch core libraries
        run: git submodule update --init libservicelocator libCerfEngine libCerfCore

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Name the Qt build folder
        id: qt
        shell: pwsh
        run: python tools/qt_windows.py --cache-outputs >> $env:GITHUB_OUTPUT

      - name: Restore the Qt build
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.qt.outputs.path }}
          key: qt-win7-x86-${{ steps.qt.outputs.key }}

      - uses: ./.github/actions/vcpkg-windows
        with:
          host-branch: ${{ env.HOST_BRANCH }}

      - uses: ./.github/actions/resvg-cache
        with:
          stage: restore
          host-branch: ${{ env.HOST_BRANCH }}
          python: python

      - name: Stamp version.h with CI build info
        id: version
        shell: pwsh
        run: python tools/stamp_version.py --run=${{ github.run_number }} --sha=${{ github.sha }} --host-branch=${{ env.HOST_BRANCH }}

      - uses: ./.github/actions/ce-tools
        with:
          url: ${{ secrets.CE_TOOLCHAIN_URL }}
          python: python

      - name: Install ccache
        shell: bash
        run: python tools/ccache_windows.py --install "$GITHUB_PATH"

      - uses: ./.github/actions/compiler-cache
        with:
          stage: restore
          host-branch: ${{ env.HOST_BRANCH }}

      - name: Build
        shell: pwsh
        run: python build.py --config Release --mode production

      - uses: ./.github/actions/compiler-cache
        if: ${{ !cancelled() }}
        with:
          stage: save
          host-branch: ${{ env.HOST_BRANCH }}

      - uses: ./.github/actions/resvg-cache
        if: ${{ !cancelled() }}
        with:
          stage: save
          host-branch: ${{ env.HOST_BRANCH }}
          python: python

      - uses: ./.github/actions/ship-pdb
        with:
          out: ${{ steps.version.outputs.out }}
          frontend: ${{ steps.version.outputs.frontend }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ steps.version.outputs.out }}/
