name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  qt-windows:
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip build]') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    concurrency:
      group: ${{ github.workflow }}-qt-windows
      cancel-in-progress: false
    uses: ./.github/workflows/qt-windows.yml

  build-windows:
    needs: qt-windows
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-windows
      cancel-in-progress: true
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  build-linux:
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip build]') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux
      cancel-in-progress: true
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  build-macos:
    needs: build-linux
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-macos
      cancel-in-progress: true
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  build-android:
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip build]') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-android
      cancel-in-progress: true
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  publish:
    name: publish beta binaries
    needs: [build-windows, build-linux, build-macos, build-android]
    if: ${{ github.event_name == 'push' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-publish
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET:            cerf
      R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PREFIX: cerf_ci

    steps:
      - uses: actions/checkout@v4

      - name: Fetch libCerfCore
        run: git submodule update --init libCerfCore

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the publish dependencies
        run: python -m pip install --quiet --disable-pip-version-check boto3 pyyaml

      - name: Stamp version.h with CI build info
        id: version
        run: python tools/stamp_version.py --run=${{ github.run_number }} --sha=${{ github.sha }}

      - name: Fetch the Windows build
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-win32-x86 }}
          path: ci/win32

      - name: Publish the Windows build to the R2 beta channel
        run: |
          name="${{ steps.version.outputs.artifact-win32-x86 }}"
          python tools/pack_release.py "ci/dist/$name.zip" ci/win32
          python tools/publish_r2_build.py --zip="ci/dist/$name.zip" --host-branch=win32-x86

      - name: Fetch the Linux build
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-linux-amd64 }}
          path: ci/linux

      - name: Publish the Linux build to the R2 beta channel
        run: |
          name="${{ steps.version.outputs.artifact-linux-amd64 }}"
          python tools/publish_r2_build.py --zip="ci/linux/$name.zip" --host-branch=linux-amd64

      - name: Fetch the macOS build
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-macos-arm64 }}
          path: ci/macos

      - name: Publish the macOS build to the R2 beta channel
        run: |
          name="${{ steps.version.outputs.artifact-macos-arm64 }}"
          python tools/publish_r2_build.py --zip="ci/macos/$name.zip" --host-branch=macos-arm64

      - name: Fetch the Android build
        if: ${{ needs.build-android.outputs.signed == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-android-arm64 }}
          path: ci/android

      - name: Publish the Android build to the R2 beta channel
        if: ${{ needs.build-android.outputs.signed == 'true' }}
        run: |
          name="${{ steps.version.outputs.artifact-android-arm64 }}"
          python tools/pack_release.py "ci/dist/$name.zip" ci/android
          python tools/publish_r2_build.py --zip="ci/dist/$name.zip" --host-branch=android-arm64

      - name: Publish the Android release APK to R2
        if: >-
          ${{ needs.build-android.outputs.signed == 'true' &&
              contains(github.event.head_commit.message, '[release cerf]') }}
        env:
          R2_PREFIX: cerf_android
        run: |
          mkdir -p ci/dist
          cp "ci/android/${{ steps.version.outputs.frontend-android-arm64 }}" ci/dist/cerf_latest.apk
          python tools/publish_r2_object.py --file=ci/dist/cerf_latest.apk --content-type=application/vnd.android.package-archive

  announce:
    needs: [build-windows, build-linux, build-macos, build-android, publish]
    if: >-
      ${{ github.event_name == 'push' &&
          !contains(github.event.head_commit.message, '[release cerf]') }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-announce
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Fetch libCerfCore
        run: git submodule update --init libCerfCore

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the announcement dependencies
        run: python -m pip install --quiet --disable-pip-version-check pillow pyyaml

      - name: Announce the build in the QA channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_SECRET: ${{ secrets.DISCORD_SECRET }}
        run: >-
          python tools/announce_build.py
          --run-id=${{ github.run_id }}
          ${{ contains(github.event.head_commit.message, '[rc]') && '--rc' || '' }}
          ${{ needs.build-android.outputs.signed != 'true' && '--without=android-arm64' || '' }}

  release:
    name: publish release binaries
    needs: [build-windows, build-linux, build-macos, build-android]
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release cerf]')
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Refuse a release without a signed Android build
        if: ${{ needs.build-android.outputs.signed != 'true' }}
        run: |
          echo "The Android signing secrets are not all set; a release needs the signed APK."
          exit 1

      - uses: actions/checkout@v4

      - name: Fetch libCerfCore
        run: git submodule update --init libCerfCore

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the release dependencies
        run: python -m pip install --quiet --disable-pip-version-check pillow pyyaml

      - name: Settle the artifact API
        run: sleep 60

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_SECRET: ${{ secrets.DISCORD_SECRET }}
        run: python tools/deploy.py --yes --sha=${{ github.sha }}
