name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip build]') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        # configuration: [Release, Debug]
        platform: [Win32]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore vcpkg deps
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-x86-windows-static-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x86-windows-static-

      - name: Restore vcpkg source downloads
        id: cache-downloads
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      - name: Activate vcpkg MSBuild integration
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Install vcpkg dependencies
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          $opts = @(
            'install', '--x-wait-for-lock',
            '--triplet', 'x86-windows-static',
            "--vcpkg-root=$env:VCPKG_INSTALLATION_ROOT",
            "--x-manifest-root=$PWD",
            "--x-install-root=$PWD\vcpkg_installed\x86-windows-static"
          )
          for ($i = 1; $i -le 3; $i++) {
            & $vcpkg @opts
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "vcpkg install attempt $i failed with exit $LASTEXITCODE"
            Start-Sleep -Seconds 30
          }
          exit 1

      - name: Stamp version.h with CI build info
        id: version
        shell: pwsh
        run: |
          $vh   = Get-Content cerf/version.h -Raw
          $maj  = [regex]::Match($vh, 'CERF_VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $min  = [regex]::Match($vh, 'CERF_VERSION_MINOR\s+(\d+)').Groups[1].Value
          $pat  = [regex]::Match($vh, 'CERF_VERSION_PATCH\s+(\d+)').Groups[1].Value
          $sha  = "${{ github.sha }}".Substring(0, 7)
          $ts   = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm") + " UTC"
          $run  = [int]"${{ github.run_number }}"
          $word = $run % 65536
          $ver  = "$maj.$min.$pat"
          $vh = $vh -replace '(?m)^#define\s+CERF_VERSION_BUILD\s+\d+',      "#define CERF_VERSION_BUILD      $run"
          $vh = $vh -replace '(?m)^#define\s+CERF_VERSION_BUILD_WORD\s+\d+', "#define CERF_VERSION_BUILD_WORD $word"
          $vh = $vh -replace '(?m)^#define\s+CERF_VERSION_DATE\s+.*$',       "#define CERF_VERSION_DATE       `"$ts`""
          $vh = $vh -replace '(?m)^#define\s+CERF_VERSION_SHA\s+.*$',        "#define CERF_VERSION_SHA        `"$sha`""
          Set-Content cerf/version.h -Value $vh -Encoding utf8 -NoNewline
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$sha"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Stamped: $maj.$min build $run (word $word), $ts, $sha"

      - name: Fetch CE build tools (private R2 mirror)
        shell: pwsh
        run: |
          curl.exe -fsSL "${{ secrets.CE_TOOLCHAIN_URL }}" -o "$env:RUNNER_TEMP\ce-tools.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ce-tools.zip" -DestinationPath "$env:RUNNER_TEMP\ce-tools" -Force
          $sdk = Get-ChildItem "$env:RUNNER_TEMP\ce-tools" -Recurse -Directory -Filter STANDARDSDK -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdk) { throw "CE toolchain zip has no STANDARDSDK folder" }
          New-Item -ItemType Directory -Force third_party | Out-Null
          if (Test-Path third_party\wince) { Remove-Item third_party\wince -Recurse -Force }
          Move-Item $sdk.Parent.FullName third_party\wince
          Write-Host "CE toolchain ready at third_party/wince"

      - name: Save vcpkg source downloads
        if: always() && steps.cache-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Save vcpkg deps
        if: always() && steps.vcpkg.outcome == 'success' && steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-x86-windows-static-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Config ${{matrix.configuration}} -Mode production

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CERF-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}-${{matrix.configuration}}-${{matrix.platform}}
          path: ./build/${{matrix.configuration}}/${{matrix.platform}}/

      - name: Publish the build to the R2 beta channel
        if: >-
          ${{ github.event_name == 'push' &&
              matrix.configuration == 'Release' && matrix.platform == 'Win32' }}
        shell: pwsh
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:            cerf
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PREFIX: cerf_ci
        run: |
          python -m pip install --quiet --disable-pip-version-check boto3 pyyaml
          $name = "CERF-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}-${{matrix.configuration}}-${{matrix.platform}}.zip"
          $zip  = Join-Path $env:RUNNER_TEMP $name
          Compress-Archive -Path "build/${{matrix.configuration}}/${{matrix.platform}}/*" -DestinationPath $zip
          python tools/publish_r2_build.py --zip="$zip"

  announce:
    needs: build
    if: >-
      ${{ github.event_name == 'push' &&
          !contains(github.event.head_commit.message, '[release cerf]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Announce the build in the QA channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_SECRET: ${{ secrets.DISCORD_SECRET }}
        run: >-
          python3 tools/announce_build.py
          --run-id=${{ github.run_id }}
          --build=${{ github.run_number }}
          ${{ contains(github.event.head_commit.message, '[rc]') && '--rc' || '' }}

  release:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release cerf]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Settle the artifact API
        run: sleep 60

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_SECRET: ${{ secrets.DISCORD_SECRET }}
        run: python3 tools/deploy.py --yes --sha=${{ github.sha }}
