name: site

on:
  push:
    branches: ["main"]
    paths:
      - "docs/website/**"
      - "docs/changelog.yml"
      - "docs/github_band.svg"
      - "libCerfCore"
      - "assets/cerf.ico"
      - "assets/icons_sources/**"
      - "tools/board_database.py"
      - "tools/build_site.py"
      - "tools/changelog.py"
      - "tools/header_defines.py"
      - "tools/product_facts.py"
      - "tools/svg_raster.py"
      - "cerf-qt/android_package_text.h"
      - "cerf-qt/cerfman/board_order_text.h"
      - "cerf-qt/executable_names_text.h"
      - "cerf-qt/install_root_files_text.h"
      - "cerf-qt/play_store_links_text.h"
      - "cerf-qt/resource_paths_text.h"
      - ".github/FUNDING.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch libCerfCore
        run: |
          git submodule update --init --depth 1 libCerfCore
          git -C libCerfCore submodule update --init --depth 1 sad

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/website/requirements.txt

      - name: Install site toolchain
        run: pip install -r docs/website/requirements.txt

      - name: Build site
        run: python tools/build_site.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/site --project-name=cerf --branch=main

      - name: Deploy the Google Play copy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/site-googleplay --project-name=cerf-play-store --branch=main
