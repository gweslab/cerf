  calibration.resolution_hint: "Przy rozdzielczości innej niż fabryczna standardowe urządzenie wejściowe może działać nieprawidłowo. Kliknij tę ikonę prawym przyciskiem, wybierz „Zmień rozdzielczość”, ustaw rozdzielczość fabryczną i wykonaj miękki reset. To powinno przywrócić prawidłowe działanie wejścia. Po zakończeniu kreatora powitalnego i kalibracji możesz ponownie wybrać dowolną rozdzielczość. System gościa zwykle pamięta ukończenie kalibracji."
  calibration.skip_hint: "W niektórych wersjach systemów Handheld PC i systemów desktopowych można pominąć kalibrację klawiszem Esc."
  calibration.stock_pointer_hint: "Ta ikona oznacza, że aktywne jest fabryczne urządzenie wejściowe. Kliknij ją, aby wrócić do ulepszonego wskaźnika myszy dodatków gościa."
